[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hal-voice"
version = "0.1.0"
description = "100% local voice interface (WSL2) — STT (Vosk FR) + TTS (pyttsx3/eSpeak). No cloud, no API key."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Olivier Lefebvre" }]
keywords = ["voice", "stt", "tts", "vosk", "offline", "french", "hal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: French",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "soundfile>=0.14.0",
    "vosk>=0.3.45",
    "pyyaml>=6.0.2",
    "pyttsx3>=2.99",
    "pynput>=1.8.2",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff>=0.16.6"]

[project.scripts]
hal-voice = "hal_voice.__main__:main"

[project.urls]
Homepage = "https://github.com/aguacongas/hal-voice"
Issues = "https://github.com/aguacongas/hal-voice/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "requires_hardware: tests qui dependent d'un micro/casque reel",
]

[tool.ruff]
line-length = 100

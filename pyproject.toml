[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hal-voice"
version = "0.1.0"
description = "100% local voice interface — STT (Vosk FR) + TTS (SAPI/pyttsx3). No cloud, no API key."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Olivier Lefebvre" }]
keywords = ["voice", "stt", "tts", "vosk", "offline", "french", "hal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Linux",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: French",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "vosk>=0.3.45",
    "pyyaml>=6.0",
    "pywin32>=306; sys_platform == 'win32'",
    "keyboard>=0.13.5; sys_platform == 'win32'",
    "pyttsx3>=2.90; sys_platform != 'win32'",
    "pynput>=1.7.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4.0"]

[project.scripts]
hal-voice = "hal_voice.__main__:main"

[project.urls]
Homepage = "https://github.com/aguacongas/hal-voice"
Issues = "https://github.com/aguacongas/hal-voice/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "requires_hardware: tests qui dependent d'un micro/casque reel",
    "requires_windows: tests qui dependent de Windows (SAPI 5, COM)",
]

[tool.ruff]
line-length = 100

# Configuration SonarCloud pour hal-voice
# https://sonarcloud.io/project/configuration?id=aguacongas_hal-voice
sonar.organization=aguacongas
sonar.projectKey=aguacongas_hal-voice
sonar.projectName=hal-voice

# Le code source est sous src/ (layout setuptools src)
sonar.sources=src
sonar.tests=tests
sonar.python.version=3.10,3.11,3.12,3.13

# Couverture produite par pytest-cov dans le job CI
sonar.python.coverage.reportPaths=coverage.xml

# En-têtes source : on analyse le chemin racine (pour rattacher src/<pkg>)
sonar.sourceEncoding=UTF-8

# Exclusions (fixtures, tests)
sonar.exclusions=**/__pycache__/**,**/*.egg-info/**
sonar.test.inclusions=tests/**/*.py

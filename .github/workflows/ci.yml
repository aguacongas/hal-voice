name: CI

on:
  push:
    branches: [main, wsl2-support]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: Qualité (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer ruff
        run: pip install "ruff>=0.16.6"
      - name: Ruff check
        run: ruff check src tests

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Dépendances système (eSpeak pour TTS)
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
      - name: Installer le paquet + dev deps
        run: |
          pip install -e ".[dev]"
      - name: Lint (format)
        run: ruff check src tests
      - name: Tests unitaires
        run: pytest -q

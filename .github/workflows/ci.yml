name: CI

on:
  push:
    branches: [main, wsl2-support]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: Qualité (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.9"
          enable-cache: true
      - name: Installer le paquet + dev deps (ruff verrouillé)
        run: uv sync --extra dev
      - name: Ruff lint
        run: uv run ruff check src tests
      - name: Ruff format (check)
        run: uv run ruff format --check src tests

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.9"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Dépendances système (eSpeak pour TTS)
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
      - name: Installer le paquet + dev deps (uv, lockfile)
        run: uv sync --extra dev
      - name: Tests unitaires + couverture
        run: uv run pytest -q --cov=hal_voice --cov-report=xml
      - name: Uploader le rapport de couverture
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: test
    # Les secrets ne sont pas lisibles dans `if` ; on les expose dans l'env
    # du job pour tester leur presence. Job skip tant que SONAR_TOKEN n'est
    # pas configure (Settings -> Secrets -> Actions).
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    if: ${{ env.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarCloud a besoin de tout l'historique pour l'analyse
      - uses: actions/download-artifact@v4
        with:
          name: coverage
      - name: Scan SonarCloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.python.coverage.reportPaths=coverage.xml

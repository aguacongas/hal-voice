name: CI

on:
  push:
    branches: [main, wsl2-support]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: Qualité (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer ruff
        run: pip install "ruff>=0.16.6"
      - name: Ruff lint
        run: ruff check src tests
      - name: Ruff format (check)
        run: ruff format --check src tests

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Dépendances système (eSpeak pour TTS)
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
      - name: Installer le paquet + dev deps
        run: |
          pip install -e ".[dev]"
      - name: Tests unitaires + couverture
        run: pytest -q --cov=hal_voice --cov-report=xml
      - name: Uploader le rapport de couverture
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: test
    # Les secrets ne sont pas lisibles dans `if` ; on les expose dans l'env
    # du job pour tester leur présence. Job skip tant que SONAR_TOKEN n'est
    # pas configuré (Settings → Secrets → Actions).
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    if: ${{ env.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarCloud a besoin de tout l'historique pour l'analyse
      - uses: actions/download-artifact@v4
        with:
          name: coverage
      - name: Scan SonarCloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.python.coverage.reportPaths=coverage.xml
